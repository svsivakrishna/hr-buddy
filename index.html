<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrightNest HR Buddy</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f7fb; color:#1f3a5f; margin:0; }
    .page { max-width: 640px; margin: 30px auto; padding: 0 16px; }
    h1 { margin: 0 0 4px; }
    .tag { color:#555; margin-bottom: 16px; }
    .chat { background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.15); overflow:hidden; }
    .head { background:#1f3a5f; color:#fff; padding:12px 16px; font-weight:bold; }
    #log { height:420px; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
    .msg { max-width:80%; padding:9px 13px; border-radius:14px; line-height:1.4; white-space:pre-wrap; }
    .bot { background:#e8eef7; align-self:flex-start; }
    .me  { background:#1f3a5f; color:#fff; align-self:flex-end; }
    .bar { display:flex; border-top:1px solid #ddd; }
    #box { flex:1; border:0; padding:14px; font-size:15px; outline:none; }
    button { border:0; background:#1f3a5f; color:#fff; padding:0 22px; font-size:15px; cursor:pointer; }
    .hint { font-size:13px; color:#666; margin-top:10px; }
  </style>
</head>
<body>
  <div class="page">
    <h1>BrightNest Technologies - HR Help Desk</h1>
    <div class="tag">Meet HR Buddy, your assistant for HR policies.</div>
    <div class="chat">
      <div class="head">HR Buddy</div>
      <div id="log"></div>
      <div class="bar">
        <input id="box" placeholder="Ask about leave, holidays, salary..." autocomplete="off">
        <button id="send">Send</button>
      </div>
    </div>
    <div class="hint">Try: leave types, holiday list, salary breakup, notice period</div>
  </div>

  <script>
    const log = document.getElementById('log');
    const box = document.getElementById('box');
    const sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));

    function add(text, who) {
      const d = document.createElement('div');
      d.className = 'msg ' + who;
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }

    async function send(text) {
      add(text, 'me');
      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, sessionId })
        });
        const data = await r.json();
        add(data.reply, 'bot');
      } catch (e) {
        add('Sorry, I could not reach HR Buddy.', 'bot');
      }
    }

    function submit() {
      const t = box.value.trim();
      if (!t) return;
      box.value = '';
      send(t);
    }
    document.getElementById('send').onclick = submit;
    box.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

    send('hello');
  </script>
</body>
</html>
